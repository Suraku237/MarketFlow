services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: dev-only-change-me
      MYSQL_DATABASE: smartschool
    ports:
      # Host-side 3307 avoids clashing with a locally installed MySQL on
      # 3306; the app services still reach this container over the internal
      # Docker network at db:3306 regardless of this mapping.
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Applied once, in filename order, only when the data volume is empty
      # (i.e. first-ever start). database/scripts/init_db.sh re-applies these
      # on demand against an already-running container.
      - ./database/schema.sql:/docker-entrypoint-initdb.d/1_schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/2_seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pdev-only-change-me"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Week 4: message broker for the "student enrolls -> invoice created"
  # asynchronous workflow. Management UI published so the live evaluation
  # can watch the exchange/queue/message directly.
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      # Host-side 5673 avoids clashing with a locally installed RabbitMQ.
      - "5673:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Week 3: not published to the host — the Gateway is the only front door.
  # Reachable from other containers at auth-service:3000.
  auth-service:
    build: ./services/auth-service
    environment:
      PORT: 3000
      JWT_SECRET: dev-only-change-me
      JWT_EXPIRES_IN: 1h
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: dev-only-change-me
      DB_NAME: smartschool
    depends_on:
      db:
        condition: service_healthy

  # Week 3 module service (courses/enrollments/grades). Also not published to
  # the host — only reachable via the Gateway at academic-service:4000.
  # Week 4: publishes "enrollment.created" to RabbitMQ on POST /api/enrollments.
  academic-service:
    build: ./services/academic-service
    environment:
      PORT: 4000
      JWT_SECRET: dev-only-change-me
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: dev-only-change-me
      DB_NAME: smartschool
      RABBITMQ_URL: amqp://rabbitmq:5672
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Week 4 module service (invoices). Not published to the host — only
  # reachable via the Gateway at finance-service:4001. Consumes
  # "enrollment.created" from RabbitMQ independently of academic-service.
  finance-service:
    build: ./services/finance-service
    environment:
      PORT: 4001
      JWT_SECRET: dev-only-change-me
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: dev-only-change-me
      DB_NAME: smartschool
      RABBITMQ_URL: amqp://rabbitmq:5672
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Week 3: the only service published to the host. All external traffic —
  # browser, curl, Postman — goes through here first.
  gateway:
    build: ./services/gateway
    ports:
      # Host-side 8081 avoids clashing with another local process already
      # using 8080; the gateway still listens on 8080 inside its container.
      - "8081:8080"
    environment:
      PORT: 8080
      JWT_SECRET: dev-only-change-me
      AUTH_SERVICE_URL: http://auth-service:3000
      ACADEMIC_SERVICE_URL: http://academic-service:4000
      FINANCE_SERVICE_URL: http://finance-service:4001
      RATE_LIMIT_WINDOW_MS: 60000
      RATE_LIMIT_MAX: 10
    depends_on:
      - auth-service
      - academic-service
      - finance-service

volumes:
  db_data:
