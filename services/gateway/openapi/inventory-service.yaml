openapi: 3.0.3
info:
  title: SmartStock Inventory Service
  version: "1.0.0"
  description: >
    Product catalog module. Reached only through the API Gateway —
    inventory-service has no port published directly to the host.
servers:
  - url: http://localhost:8080/api/v1
    description: Via the API Gateway
tags:
  - name: products
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Product:
      type: object
      properties:
        id: { type: integer, example: 1 }
        sku: { type: string, example: "BEV-001" }
        name: { type: string, example: "Mineral Water 1.5L" }
        category_id: { type: integer, example: 1 }
        category_name: { type: string, example: "Beverages" }
        supplier_id: { type: integer, nullable: true, example: 1 }
        unit_price: { type: string, example: "500.00" }
        quantity_in_stock: { type: integer, example: 120 }
        reorder_level: { type: integer, example: 30 }
    Error:
      type: object
      properties:
        error: { type: string }
security:
  - bearerAuth: []
paths:
  /products:
    get:
      tags: [products]
      summary: List all products
      responses:
        "200":
          description: Product list
          content:
            application/json:
              schema:
                type: object
                properties:
                  service: { type: string, example: "inventory-service" }
                  products:
                    type: array
                    items: { $ref: "#/components/schemas/Product" }
        "401":
          description: Not authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      tags: [products]
      summary: Create a product (Admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sku, name, categoryId, unitPrice]
              properties:
                sku: { type: string, example: "BEV-003" }
                name: { type: string, example: "Sparkling Water 500ml" }
                categoryId: { type: integer, example: 1 }
                supplierId: { type: integer, nullable: true }
                unitPrice: { type: number, example: 650 }
                quantityInStock: { type: integer, default: 0 }
                reorderLevel: { type: integer, default: 10 }
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                type: object
                properties:
                  service: { type: string }
                  product: { $ref: "#/components/schemas/Product" }
        "400":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Authenticated but not an Admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: SKU already exists
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /products/{id}:
    get:
      tags: [products]
      summary: Get a single product by id
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Product found
          content:
            application/json:
              schema:
                type: object
                properties:
                  service: { type: string }
                  product: { $ref: "#/components/schemas/Product" }
        "404":
          description: Product not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
