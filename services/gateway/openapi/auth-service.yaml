openapi: 3.0.3
info:
  title: SmartSchool Auth Service
  version: "1.0.0"
  description: >
    Registration, login and role-based access control (Admin / Teacher /
    Student). Reached only through the API Gateway — auth-service has no
    port published directly to the host.
servers:
  - url: http://localhost:8081/api/v1
    description: Via the API Gateway
tags:
  - name: auth
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      properties:
        id: { type: integer, example: 1 }
        name: { type: string, example: "Ada Admin" }
        email: { type: string, format: email, example: "admin@smartschool.test" }
        role: { type: string, enum: [admin, teacher, student], example: "admin" }
        createdAt: { type: string, format: date-time }
    Error:
      type: object
      properties:
        error: { type: string }
paths:
  /auth/register:
    post:
      tags: [auth]
      summary: Register a new user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string, example: "Ada Admin" }
                email: { type: string, format: email, example: "admin@smartschool.test" }
                password: { type: string, format: password, minLength: 8, example: "adminpass123" }
                role: { type: string, enum: [admin, teacher, student], default: student }
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/User" }
        "400":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Email already registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/login:
    post:
      tags: [auth]
      summary: Log in and receive a JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        "200":
          description: Login succeeded
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  user: { $ref: "#/components/schemas/User" }
        "401":
          description: Invalid email or password
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/me:
    get:
      tags: [auth]
      summary: Get the identity encoded in the caller's JWT
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Decoded token claims
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      sub: { type: integer }
                      email: { type: string }
                      role: { type: string }
                      name: { type: string }
        "401":
          description: Missing/invalid/expired token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /reports:
    get:
      tags: [auth]
      summary: Academic performance report (RBAC + live rule-change demo endpoint)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Report visible to the caller's role (Admin or Teacher)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  requestedBy: { type: string }
        "401":
          description: Not authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Authenticated but role not permitted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
